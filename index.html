<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Japan">
<meta name="theme-color" content="#1c1c1e">
<title>Japan</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗾</text></svg>">
<style>
  :root {
    --bg: #1c1c1e;
    --card: #2c2c2e;
    --card-2: #3a3a3c;
    --text: #ffffff;
    --text-2: #d1d1d6;
    --hint: #8e8e93;
    --border: rgba(142,142,147,0.2);
    --accent: #ff8a3d;
    --green: #34c759;
    --danger: #ff3b30;
    --link: #0a84ff;
    --tabbar-h: 64px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 0 16px calc(var(--tabbar-h) + 96px + env(safe-area-inset-bottom));
    min-height: 100vh;
    max-width: 720px;
    margin: 0 auto;
  }

  button { font-family: inherit; }

  /* Header */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: calc(16px + env(safe-area-inset-top)) 0 4px;
  }

  h1 {
    font-size: 28px;
    font-weight: 800;
    margin: 4px 0 16px;
    letter-spacing: -0.5px;
  }

  h1 span { color: var(--accent); }

  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 17px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .icon-btn.spinning { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .banner {
    background: rgba(255,138,61,0.12);
    border: 1px solid rgba(255,138,61,0.35);
    color: var(--text-2);
    font-size: 13px;
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 16px;
  }

  /* Form fields (expense_bot style) */
  .field { margin-bottom: 20px; }

  .field > label, .label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--hint);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 8px;
  }
  .opt { text-transform: none; font-weight: 400; font-size: 11px; }

  .input, select, textarea {
    width: 100%;
    padding: 13px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 16px;
    appearance: none;
    -webkit-appearance: none;
    outline: none;
    font-family: inherit;
  }
  .input:focus, select:focus, textarea:focus { border-color: rgba(255,138,61,0.6); }
  input[type="date"], input[type="time"] { min-height: 48px; color-scheme: dark; }

  textarea { resize: vertical; }

  select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%238e8e93' stroke-width='1.5' fill='none' fill-rule='evenodd'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 36px;
  }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .amount-row {
    display: flex;
    align-items: center;
    background: #000000;
    border-radius: 14px;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .amount-row .currency {
    padding: 0 4px 0 16px;
    color: var(--hint);
    font-size: 20px;
    font-weight: 700;
  }
  .amount-row input {
    border: none;
    background: transparent;
    flex: 1;
    min-width: 0;
    font-size: 32px;
    font-weight: 800;
    padding: 14px 16px 14px 4px;
    color: #ffffff;
    letter-spacing: -0.5px;
    font-family: inherit;
  }
  .amount-row input:focus { outline: none; }
  .amount-row input::placeholder { color: rgba(255,255,255,0.2); }

  .split-amount-row {
    display: flex;
    align-items: center;
    background: #000000;
    border-radius: 14px;
    border: 1px solid var(--border);
    overflow: hidden;
    margin-bottom: 10px;
  }
  .split-amount-row .name-label {
    padding: 0 4px 0 16px;
    color: var(--hint);
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
  }
  .split-amount-row input {
    border: none;
    background: transparent;
    flex: 1;
    width: 100%;
    font-size: 18px;
    font-weight: 700;
    padding: 12px 16px 12px 8px;
    color: #ffffff;
    text-align: right;
    font-family: inherit;
  }
  .split-amount-row input:focus { outline: none; }
  .split-amount-row input::placeholder { color: rgba(255,255,255,0.2); }
  .split-amount-row input:disabled { color: var(--hint); }

  .error-text { color: var(--danger); font-size: 13px; margin-top: 6px; display: none; }

  /* Chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips.scroll {
    flex-wrap: nowrap;
    overflow-x: auto;
    margin: 0 -16px;
    padding: 0 16px 2px;
    scrollbar-width: none;
  }
  .chips.scroll::-webkit-scrollbar { display: none; }

  .chip {
    padding: 9px 16px;
    border-radius: 999px;
    background: var(--card);
    border: 1.5px solid var(--border);
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .chip.small { padding: 6px 12px; font-size: 13px; }
  .chip.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.add-new { color: var(--link); border-style: dashed; background: transparent; }
  .new-label-input { display: none; margin-top: 10px; }

  /* Toggle */
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card);
    border-radius: 12px;
    padding: 15px 16px;
    margin-bottom: 20px;
    border: 1px solid var(--border);
  }
  .toggle-label { font-size: 16px; font-weight: 600; }
  .toggle { position: relative; width: 51px; height: 31px; flex-shrink: 0; }
  .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
  .toggle-thumb {
    position: absolute;
    inset: 0;
    background: rgba(120,120,128,0.4);
    border-radius: 999px;
    transition: background 0.2s ease;
    cursor: pointer;
  }
  .toggle-thumb::after {
    content: "";
    position: absolute;
    width: 27px;
    height: 27px;
    left: 2px;
    top: 2px;
    background: #ffffff;
    border-radius: 50%;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    transition: transform 0.2s ease;
  }
  .toggle input:checked + .toggle-thumb { background: var(--green); }
  .toggle input:checked + .toggle-thumb::after { transform: translateX(20px); }

  /* Buttons */
  .submit-btn {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.2px;
    transition: background 0.15s ease, transform 0.1s ease;
    cursor: pointer;
  }
  .submit-btn:active { transform: scale(0.97); }
  .submit-btn.submitting { background: var(--green); pointer-events: none; }
  .ghost-btn {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--danger);
    font-size: 16px;
    font-weight: 600;
    margin-top: 10px;
    cursor: pointer;
  }
  .ghost-btn.neutral { color: var(--text-2); }

  /* Filters */
  .filters { display: grid; gap: 10px; margin-bottom: 18px; }
  .filters .row2 select, .filters .input { padding-top: 10px; padding-bottom: 10px; font-size: 15px; }
  .filters input[type="search"] { min-height: 0; }

  .segmented {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 3px;
    margin-bottom: 20px;
  }
  .segmented button {
    border: none;
    background: transparent;
    color: var(--hint);
    font-size: 14px;
    font-weight: 700;
    padding: 9px 6px;
    border-radius: 9px;
    cursor: pointer;
  }
  .segmented button.active { background: var(--card-2); color: var(--text); }

  /* Groups & cards */
  .group { margin-bottom: 24px; }
  .group-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin: 0 2px 10px;
  }
  .group-title { font-size: 19px; font-weight: 800; letter-spacing: -0.3px; }
  .group-sub { font-size: 13px; color: var(--hint); font-weight: 600; white-space: nowrap; }
  .subgroup-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--hint);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin: 16px 2px 8px;
  }
  .group-head + .subgroup-title { margin-top: 4px; }
  .order-arrows { display: flex; flex-direction: column; justify-content: center; gap: 4px; flex-shrink: 0; margin: -4px -4px -4px 0; }
  .arrow-btn {
    width: 28px;
    height: 24px;
    padding: 0;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--card-2);
    color: var(--text);
    font-size: 10px;
    cursor: pointer;
  }
  .arrow-btn:active { background: var(--accent); }
  .arrow-btn:disabled { opacity: 0.25; cursor: default; }
  .day-pill {
    display: inline-block;
    font-size: 11px;
    font-weight: 800;
    color: var(--accent);
    background: rgba(255,138,61,0.14);
    border-radius: 6px;
    padding: 3px 7px;
    margin-right: 8px;
    vertical-align: 3px;
    letter-spacing: 0.4px;
  }

  .card {
    display: flex;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .card:active { background: #333336; }
  /* Highlighted card: the same orange tint as the DAY pill */
  .card.hl { background: rgba(255,138,61,0.14); border-color: rgba(255,138,61,0.45); }
  .card.hl:active { background: rgba(255,138,61,0.22); }
  .ev.hl { background: var(--accent); border-left-color: #fff; color: #fff; }
  .ev.hl .ev-time { color: rgba(255,255,255,0.85); }
  .card .when {
    width: 52px;
    flex-shrink: 0;
    font-size: 14px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1.25;
    padding-top: 2px;
  }
  .card .when small { display: block; color: var(--hint); font-size: 11px; font-weight: 600; }
  .card .body { flex: 1; min-width: 0; }
  .card .title { font-size: 16px; font-weight: 700; line-height: 1.3; word-wrap: break-word; }
  .card .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .pill {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-2);
    background: var(--card-2);
    border-radius: 6px;
    padding: 3px 8px;
  }
  .pill.done { color: var(--green); background: rgba(52,199,89,0.14); }
  .card .notes {
    font-size: 14px;
    color: var(--text-2);
    margin-top: 8px;
    white-space: pre-wrap;
    word-wrap: break-word;
    line-height: 1.4;
  }
  .card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .link-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    font-weight: 700;
    color: var(--link);
    background: rgba(10,132,255,0.12);
    border: none;
    border-radius: 8px;
    padding: 7px 11px;
    text-decoration: none;
    cursor: pointer;
  }
  .link-btn.orange { color: var(--accent); background: rgba(255,138,61,0.12); }

  .empty {
    text-align: center;
    color: var(--hint);
    padding: 48px 16px;
    font-size: 15px;
    line-height: 1.5;
  }
  .empty .big { font-size: 44px; display: block; margin-bottom: 8px; }

  /* Expense list */
  .summary {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .summary-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .summary-total { font-size: 34px; font-weight: 800; letter-spacing: -0.8px; margin-top: 2px; }
  .summary select { width: auto; padding: 7px 32px 7px 12px; font-size: 14px; border-radius: 10px; }
  .summary-note { font-size: 12px; color: var(--hint); margin-top: 4px; }
  .people { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .person { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
  .person .name { font-size: 12px; color: var(--hint); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .person .num { font-size: 17px; font-weight: 800; margin-top: 2px; }
  .person .sub { font-size: 12px; color: var(--hint); margin-top: 2px; }
  .settle { margin-top: 12px; font-size: 14px; font-weight: 700; color: var(--accent); }
  .bars { margin-top: 14px; display: grid; gap: 8px; }
  .bar-row { display: grid; grid-template-columns: 92px 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
  .bar-row .lbl { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 99px; }
  .bar-row .val { color: var(--hint); font-weight: 600; font-variant-numeric: tabular-nums; }

  .exp-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .exp-row .desc { font-size: 15px; font-weight: 700; word-wrap: break-word; }
  .exp-row .sub { font-size: 12px; color: var(--hint); margin-top: 3px; }
  .exp-row .amt { text-align: right; font-weight: 800; font-size: 16px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .exp-row .amt small { display: block; font-size: 12px; color: var(--hint); font-weight: 600; }

  /* FAB + tab bar */
  .fab {
    position: fixed;
    right: max(16px, calc(50vw - 344px));
    bottom: calc(var(--tabbar-h) + 18px + env(safe-area-inset-bottom));
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 30px;
    font-weight: 400;
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    cursor: pointer;
    z-index: 20;
  }
  .fab:active { transform: scale(0.94); }

  .tabbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: rgba(28,28,30,0.94);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
    z-index: 30;
  }
  .tabbar button {
    border: none;
    background: transparent;
    color: var(--hint);
    font-size: 11px;
    font-weight: 700;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
  }
  .tabbar button .ico { font-size: 22px; filter: grayscale(1) opacity(0.6); }
  .tabbar button.active { color: var(--accent); }
  .tabbar button.active .ico { filter: none; }

  /* Schedule (calendar day view) */
  #schedDays { margin-bottom: 16px; }
  .sched-day {
    flex-shrink: 0;
    min-width: 58px;
    padding: 7px 10px;
    border-radius: 12px;
    background: var(--card);
    border: 1.5px solid var(--border);
    color: var(--text);
    text-align: center;
    cursor: pointer;
    font-weight: 700;
    font-size: 14px;
    line-height: 1.2;
  }
  .sched-day small { display: block; font-size: 10px; font-weight: 800; color: var(--hint); letter-spacing: 0.4px; }
  .sched-day.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
  .sched-day.selected small { color: rgba(255,255,255,0.8); }
  .sched-day.has-items:not(.selected) small { color: var(--accent); }
  .sched-allday { display: grid; gap: 6px; margin-bottom: 10px; }
  .sched-allday .ev { position: static; height: auto; }
  .sched-grid { position: relative; margin-left: 46px; border-left: 1px solid var(--border); }
  .sched-hour { position: absolute; left: -46px; right: 0; border-top: 1px solid var(--border); }
  .sched-hour span {
    position: absolute;
    left: 0;
    top: -8px;
    width: 40px;
    font-size: 11px;
    font-weight: 600;
    color: var(--hint);
    background: var(--bg);
    font-variant-numeric: tabular-nums;
  }
  .sched-now { position: absolute; left: -4px; right: 0; border-top: 2px solid #ff453a; z-index: 2; }
  .sched-now::before { content: ""; position: absolute; left: -4px; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: #ff453a; }
  .ev {
    position: absolute;
    box-sizing: border-box;
    padding: 4px 7px;
    border-radius: 8px;
    border-left: 3px solid var(--ev, var(--accent));
    background: color-mix(in srgb, var(--ev, var(--accent)) 22%, var(--card));
    overflow: hidden;
    cursor: pointer;
    font-size: 12px;
    line-height: 1.25;
  }
  .ev:active { filter: brightness(1.2); }
  .ev b { display: block; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev .ev-time { color: var(--hint); font-weight: 600; font-variant-numeric: tabular-nums; }
  .ev.tall b { white-space: normal; }
  .ev b .ev-time { font-size: 11px; margin-right: 4px; }

  /* Link rows in the place sheet */
  .link-row { display: grid; gap: 8px; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
  .link-row-2 { display: flex; gap: 8px; }
  .link-row-2 .input { flex: 1; min-width: 0; }
  .link-remove {
    width: 46px;
    flex-shrink: 0;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card-2);
    color: var(--hint);
    font-size: 15px;
    cursor: pointer;
  }
  .add-link {
    width: 100%;
    padding: 11px;
    border-radius: 12px;
    border: 1.5px dashed var(--border);
    background: transparent;
    color: var(--link);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  /* Bottom sheet */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 50;
    display: none;
  }
  .backdrop.visible { display: block; }
  .sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    max-width: 720px;
    margin: 0 auto;
    max-height: 92vh;
    overflow-y: auto;
    background: var(--bg);
    border-radius: 20px 20px 0 0;
    border-top: 1px solid var(--border);
    padding: 0 16px calc(24px + env(safe-area-inset-bottom));
    z-index: 60;
    transform: translateY(105%);
    transition: transform 0.25s ease;
  }
  .sheet.visible { transform: translateY(0); }
  .sheet-head {
    position: sticky;
    top: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0 14px;
    margin-bottom: 4px;
    z-index: 1;
  }
  .sheet-head h2 { font-size: 18px; font-weight: 800; margin: 0; }
  .sheet-head button {
    border: none;
    background: transparent;
    color: var(--link);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    padding: 4px;
  }
  .sheet-head button.save { color: var(--accent); font-weight: 800; }

  /* Toast */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(var(--tabbar-h) + 90px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px);
    background: #3a3a3c;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 16px;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    opacity: 0;
    pointer-events: none;
    transition: all 0.2s ease;
    z-index: 80;
    max-width: calc(100vw - 32px);
    text-align: center;
  }
  .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--danger); }

  .hidden { display: none !important; }
</style>
</head>
<body>

  <div class="topbar">
    <h1 id="pageTitle">Japan <span>itinerary</span></h1>
    <button class="icon-btn" id="refreshBtn" title="Refresh from sheet" aria-label="Refresh">↻</button>

  <div class="banner hidden" id="demoBanner">
    Demo mode: no <b>API_URL</b> is set, so everything is saved on this device only.
    See README.md to connect the Google Sheet.
  </div>

  <!-- ─── Itinerary ─── -->
  <section id="tab-itinerary">
    <div class="filters">
      <input class="input" type="search" id="itinSearch" placeholder="Search places or notes">
      <div class="row2">
        <select id="itinDay"></select>
        <select id="itinCity"></select>
      </div>
      <select id="itinArea" class="hidden"></select>
      <div class="chips scroll" id="itinTags"></div>
    </div>
    <div id="itinList"></div>
  </section>

  <!-- ─── Schedule ─── -->
  <section id="tab-schedule" class="hidden">
    <div class="chips scroll sched-days" id="schedDays"></div>
    <div id="schedView"></div>
  </section>

  <!-- ─── Saved locations ─── -->
  <section id="tab-saved" class="hidden">
    <div class="filters">
      <input class="input" type="search" id="savedSearch" placeholder="Search saved places">
      <div class="row2">
        <select id="savedGroup">
          <option value="area">By city &amp; area</option>
          <option value="tag">By tag</option>
          <option value="none">No grouping</option>
        </select>
        <select id="savedCity"></select>
      </div>
      <select id="savedArea" class="hidden"></select>
      <div class="chips scroll" id="savedTags"></div>
    </div>
    <div id="savedList"></div>
  </section>

  <!-- ─── Expenses ─── -->
  <section id="tab-expenses" class="hidden">
    <div class="segmented" id="expSeg">
      <button data-mode="add" class="active">New expense</button>
      <button data-mode="history">History</button>
    </div>

    <div id="expAdd">
      <div class="field">
        <label>Updated by</label>
        <select class="input" id="recordedBy"></select>
      </div>

      <div class="field">
        <label>Currency</label>
        <div class="chips" id="currencyChips"></div>
      </div>

      <div class="field">
        <label>Amount</label>
        <div class="amount-row">
          <span class="currency" id="currencyLabel">¥</span>
          <input id="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0">
        </div>
        <div class="error-text" id="amountError">Enter an amount greater than 0.</div>

      <div class="field">

        <label>Payment method</label>

      <div class="field">
        <label>Labels</label>

      </div>

      <div class="toggle-row">
        <span class="toggle-label">Split</span>

          <input type="checkbox" id="split">

      <div class="field" id="splitAmountField" style="display:none;">
        <label>Split type</label>
        <select class="input" id="splitType">
          <option value="50/50">50/50</option>
          <option value="Adjusted">Adjusted</option>
          <option value="Exact Amount">Exact Amount</option>

        <label style="margin-top:16px;">Split amount <span class="opt">(optional)</span></label>
        <div id="splitAmountRows"></div>
      </div>

      <div class="field">
        <label>Paid by</label>
        <div class="chips" id="paidByChips"></div>
      </div>

      <div class="field">
        <label>Notes <span class="opt">(optional)</span></label>
        <textarea class="input" id="expNotes" rows="3" placeholder="Any extra detail..."></textarea>
      </div>

      <div class="field">
        <label>Payment method tag <span class="opt">(optional)</span></label>
        <div class="chips" id="paymentTagChips"></div>
        <input class="input new-label-input" id="newPaymentTagInput" type="text" placeholder="Type a new tag, press enter">
      </div>

      <div class="field">
        <label>Payment method note <span class="opt">(optional)</span></label>

      <button class="submit-btn" id="expSubmit">Add expense</button>

    <div id="expHistory" class="hidden">
      <div id="expSummary"></div>

  <button class="fab" id="fab" aria-label="Add">+</button>

  <nav class="tabbar">

    <button data-tab="schedule"><span class="ico">🕒</span>Schedule</button>

    <button data-tab="expenses"><span class="ico">💴</span>Expenses</button>

  <!-- Place sheet (itinerary + saved share it) -->
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="placeSheet" role="dialog" aria-modal="true">
    <div class="sheet-head">

    <div class="field">
      <label>City</label>

    </div>

    <div class="field" id="pAreaField">
      <label>Area <span class="opt">(optional)</span></label>
      <select class="input" id="pArea"></select>
    </div>

    <div class="field" id="pScheduleField">
      <label>Start <span class="opt">(day required, time optional)</span></label>
      <div class="row2">
        <select class="input" id="pDay" aria-label="Start day"></select>
        <input class="input" id="pTime" type="time" aria-label="Start time">
      </div>
      <label style="margin-top:14px;">End <span class="opt">(optional — pick a later day only if it runs over several days)</span></label>
      <div class="row2">
        <select class="input" id="pEndDay" aria-label="End day"></select>
        <input class="input" id="pEndTime" type="time" aria-label="End time">

      <input type="hidden" id="pDate">
