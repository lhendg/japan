    <div class="field hidden" id="pOrderField">
      <label>Order <span class="opt">(within the day: 1 shows first; leave blank to sort by time)</span></label>
      <input class="input" id="pOrder" type="number" inputmode="decimal" step="any" placeholder="e.g. 1">
    </div>

    <div class="field">
      <label>Maps link <span class="opt">(optional, shows a Maps button)</span></label>
      <input class="input" id="pMap" type="url" inputmode="url" placeholder="https://maps.app.goo.gl/…">
    </div>

    <div class="field">
      <label>Other links <span class="opt">(optional: website, tickets, reservation, menu…)</span></label>
      <div id="pLinks"></div>
      <button type="button" class="add-link" id="pAddLink">＋ Add link</button>
    </div>

    <div class="field">
      <label>Notes <span class="opt">(optional)</span></label>
      <textarea class="input" id="pNotes" rows="3" placeholder="Reservations, what to order, opening hours..."></textarea>
    </div>

    <button class="submit-btn" id="pSubmit">Save</button>
    <button class="ghost-btn neutral hidden" id="pToItin">＋ Add to itinerary</button>
    <button class="ghost-btn hidden" id="pDelete">Delete</button>
  </div>

  <div class="toast" id="toast"></div>

<script>
  // ─── CUSTOMIZE HERE ───────────────────────────────────────────
  // Apps Script web app URL (ends in /exec). Leave empty for demo mode (this device only).
  const API_URL = "https://script.google.com/macros/s/AKfycbzADHeS98zt0_uYI4jdgkzPiOs30u2gzEPl3p_Y1WXIy77hqbaaNZ89t8zT80j0xtt-/exec";

  const PEOPLE              = ["Lhen", "Owen"];
  const RECORDED_BY_DEFAULT = "Lhen";
  const PAID_BY_DEFAULT     = "Lhen";

  const TAGS = [
    { name: "Restaurant",     emoji: "🍜" },
    { name: "Cafe",           emoji: "☕" },
    { name: "Experience",     emoji: "🎢" },
    { name: "View",           emoji: "🏔️" },
    { name: "Shopping",       emoji: "🛍️" },
    { name: "Transportation", emoji: "🚆", itineraryOnly: true },
  ];

  // Each city's areas; a city with no areas just skips the area picker.
  const TOKYO_AREAS = [
    { name: "Asakusa / Ueno",               emoji: "🏯" },
    { name: "Akihabara / Kanda",            emoji: "⚡" },
    { name: "Tokyo Station / Marunouchi",   emoji: "🏙️" },
    { name: "Ginza / Tsukiji",              emoji: "🛍️" },
    { name: "Shibuya",                      emoji: "🌆" },
    { name: "Harajuku / Omotesando",        emoji: "🌸" },
    { name: "Shinjuku",                     emoji: "🏙️" },
    { name: "Shimokitazawa / Setagaya",     emoji: "🎸" },
    { name: "Roppongi / Akasaka",           emoji: "🌃" },
    { name: "Odaiba / Tokyo Bay",           emoji: "🌊" },
    { name: "Ryogoku / Sumida",             emoji: "🥋" },
    { name: "Kiyosumi / Fukagawa",          emoji: "☕" },
    { name: "Nihonbashi / Ningyocho",       emoji: "🏮" },
    { name: "Jiyugaoka / Nakameguro",       emoji: "🌿" },
    { name: "Kagurazaka / Iidabashi",       emoji: "🎎" },
    { name: "Koenji / Nakano",              emoji: "🎶" },
    { name: "Meguro / Gotanda / Shinagawa", emoji: "🌳" },
    { name: "Sengawa / Chofu",              emoji: "🥚" },
  ];

  const CITIES = [
    { name: "Tokyo",           emoji: "🗼", areas: TOKYO_AREAS },
    { name: "Fujikawaguchiko", emoji: "🗻", areas: [] },
    { name: "Hakone",          emoji: "♨️", areas: [] },
  ];
  const DEFAULT_CITY = "Tokyo";

  // Trip dates: the Day filter always lists every day in this range (Day 1 = start)
  const TRIP_START = "2026-11-08";
  const TRIP_END   = "2026-11-16";

  // Add a currency here to make it selectable (code → symbol, decimals shown).
  const CURRENCIES = {
    JPY: { symbol: "¥",  decimals: 0 },
    PHP: { symbol: "₱",  decimals: 2 },
    USD: { symbol: "$",  decimals: 2 },
  };
  const DEFAULT_CURRENCY = "JPY";

  const PAYMENT_METHODS = ["Credit Card", "Cash", "IC Card (Suica/Pasmo)", "Bank Transfer"];
  const PAYMENT_DEFAULT = "Credit Card";
  const DEFAULT_LABELS  = ["Food", "Transport", "Lodging", "Shopping", "Activities", "Souvenirs", "Other"];
  const PAYMENT_TAGS    = ["RCBC Plat", "RCBC Gold", "BDO CC", "BPI CC", "Gcash", "Maya", "Others"];
  // ──────────────────────────────────────────────────────────────

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const tagOf = name => TAGS.find(t => t.name === name);
  const cityOf = name => CITIES.find(c => c.name === name);
  const cityOfArea = area => CITIES.find(c => c.areas.some(a => a.name === area));
  const areaOf = name => CITIES.flatMap(c => c.areas).find(a => a.name === name);
  // Rows saved before cities existed have only an area; infer the city from it.
  const rowCity = r => r.city || cityOfArea(r.area)?.name || "";
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const list = s => String(s || "").split(",").map(x => x.trim()).filter(Boolean);

  // Browser storage is a convenience cache only; the sheet is the source of truth.
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  const EMPTY_DB = () => ({ Itinerary: [], Saved: [], Expenses: [] });
  let db = normalize(store.get("japan.cache", EMPTY_DB()));

  // ─── Dates & money ───────────────────────────────────────────
  const isoOf = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const todayISO = () => isoOf(new Date());
  function parseISO(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || "");
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function fmtDate(s, opts = { weekday: "short", month: "short", day: "numeric" }) {
    const d = parseISO(s);
    return d ? d.toLocaleDateString(undefined, opts) : s;
  }
  // 24-hour clock with a leading zero: "05:45", "18:00"
  function fmtTime(t) {
    const m = /^(\d{1,2}):(\d{2})/.exec(t || "");
    return m ? `${m[1].padStart(2, "0")}:${m[2]}` : t || "";
  }
  function money(amount, cur) {
    const c = CURRENCIES[cur] || { symbol: cur + " ", decimals: 2 };
    const n = Number(amount) || 0;
    return c.symbol + n.toLocaleString(undefined, { minimumFractionDigits: c.decimals, maximumFractionDigits: c.decimals });
  }

  // ─── Data layer ──────────────────────────────────────────────
  function normalize(data) {
    const out = EMPTY_DB();
    for (const k of Object.keys(out)) out[k] = Array.isArray(data?.[k]) ? data[k].filter(r => r && r.id) : [];
    out.Expenses.forEach(e => {
      e.amount = Number(e.amount) || 0;
      e.split = e.split === true || String(e.split).toUpperCase() === "TRUE";
      e.currency = e.currency || DEFAULT_CURRENCY;
    });
    return out;
  }

  function applyLocal(target, action, sheet, data) {
    const rows = target[sheet];
    const i = rows.findIndex(r => r.id === data.id);
    if (action === "delete") { if (i >= 0) rows.splice(i, 1); }
    else if (i >= 0) rows[i] = { ...rows[i], ...data };
    else rows.push({ created_at: new Date().toISOString(), ...data });
  }

  async function apiLoad() {
    if (!API_URL) return store.get("japan.demo", EMPTY_DB());
    const get = () => fetch(API_URL + "?action=list");
    const res = await get().catch(() => new Promise(r => setTimeout(r, 800)).then(get));
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "Load failed");
    return json.data;
  }

  async function apiWrite(action, sheet, data) {
    if (!API_URL) {
      const demo = normalize(store.get("japan.demo", EMPTY_DB()));
      applyLocal(demo, action, sheet, data);
      store.set("japan.demo", demo);
      return;
    }
    // text/plain avoids a CORS preflight, which Apps Script cannot answer
    const send = () => fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action, sheet, data }),
    });
    // A cold Apps Script sometimes drops the first request; writes are keyed by id, so one retry is safe.
    const res = await send().catch(() => new Promise(r => setTimeout(r, 800)).then(send));
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "Save failed");
    return json.data;
  }

  // Optimistic: update the screen first, roll back if the sheet refuses.
  async function mutate(action, sheet, data) {
    const before = JSON.stringify(db);
    applyLocal(db, action, sheet, data);
    store.set("japan.cache", db);
    renderAll();
    try {
      const saved = await apiWrite(action, sheet, data);
      if (saved && action !== "delete") { applyLocal(db, "update", sheet, saved); store.set("japan.cache", db); }
      return true;
    } catch (err) {
      db = normalize(JSON.parse(before));
      store.set("japan.cache", db);
      renderAll();
      toast("Couldn't save: " + err.message, true);
      return false;
    }
  }

  async function refresh(quiet) {
    $("refreshBtn").classList.add("spinning");
    try {
      db = normalize(await apiLoad());
      store.set("japan.cache", db);
      renderAll();
      if (!quiet) toast("Up to date");
    } catch (err) {
      toast("Couldn't load: " + err.message, true);
    } finally {
      $("refreshBtn").classList.remove("spinning");
    }
  }

  // ─── Toast ───────────────────────────────────────────────────
  let toastTimer;
  function toast(msg, isError) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.toggle("error", !!isError);
    t.classList.add("visible");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("visible"), isError ? 4000 : 1800);
  }

  // ─── Tabs ────────────────────────────────────────────────────
  const TAB_TITLES = { itinerary: "itinerary", schedule: "schedule", saved: "saved", expenses: "expenses" };
  let currentTab = store.get("japan.tab", "itinerary");

  function showTab(tab) {
    currentTab = tab;
    store.set("japan.tab", tab);
    document.querySelectorAll(".tabbar button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
    ["itinerary", "schedule", "saved", "expenses"].forEach(t => $("tab-" + t).classList.toggle("hidden", t !== tab));
    $("pageTitle").innerHTML = `Japan <span>${TAB_TITLES[tab]}</span>`;
    $("fab").classList.toggle("hidden", tab === "expenses");
    window.scrollTo(0, 0);
    if (tab === "schedule" && typeof renderSchedule === "function") renderSchedule();
  }
  document.querySelectorAll(".tabbar button").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));

  // ─── Shared bits ─────────────────────────────────────────────
  // Maps button only when a Maps link was given
  function mapsLink(row, text) {
    let url = (row.map_url || "").trim();
    if (!url) return "";
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    return `<a class="link-btn" href="${esc(url)}" target="_blank" rel="noopener" data-stop>📍 ${text}</a>`;
  }

  // A row's other links: the `links` column (JSON list of { url, label }), or the older
  // single link_url / link_label columns for rows saved before there could be several
  function linksOf(row) {
    let list = row.links;
    if (typeof list === "string") { try { list = list.trim() ? JSON.parse(list) : []; } catch { list = []; } }
    if (!Array.isArray(list)) list = [];
    list = list.filter(l => l && String(l.url || "").trim());
    if (!list.length && String(row.link_url || "").trim()) list = [{ url: row.link_url, label: row.link_label || "" }];
    return list;
  }

  // One 🔗 button per link, named by its label or the site's name (e.g. "klook.com")
  function extraLink(row) {
    return linksOf(row).map(l => {
      let url = String(l.url).trim();
      if (!/^https?:\/\//i.test(url)) url = "https://" + url;
      let label = l.label;
      if (!label) { try { label = new URL(url).hostname.replace(/^www\./, ""); } catch { label = "Link"; } }
      return `<a class="link-btn" href="${esc(url)}" target="_blank" rel="noopener" data-stop>🔗 ${esc(label)}</a>`;
    }).join("");
  }

  function cityOptions(select, allLabel) {
    select.innerHTML = `<option value="">${allLabel}</option>` +
      CITIES.map(c => `<option value="${esc(c.name)}">${c.emoji} ${esc(c.name)}</option>`).join("");
  }

  // Fills an area select with one city's areas; hides it when that city has none.
  function areaOptions(select, allLabel, city, hideEl = select) {
    const areas = cityOf(city)?.areas || [];
    select.innerHTML = `<option value="">${allLabel}</option>` +
      areas.map(a => `<option value="${esc(a.name)}">${a.emoji} ${esc(a.name)}</option>`).join("");
    hideEl.classList.toggle("hidden", !areas.length);
  }

  function tagFilterChips(el, tags, selected, onChange) {
    el.innerHTML = tags.map(t =>
      `<div class="chip small${selected.has(t.name) ? " selected" : ""}" data-tag="${esc(t.name)}">${t.emoji} ${esc(t.name)}</div>`
    ).join("");
    el.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
      const n = c.dataset.tag;
      selected.has(n) ? selected.delete(n) : selected.add(n);
      onChange();
    }));
  }

  function matchesQuery(row, q) {
    if (!q) return true;
    return [row.name, row.notes, rowCity(row), row.area, row.tag].join(" ").toLowerCase().includes(q.toLowerCase());
  }

  function placeCardBody(row, extraPills = "") {
    const tag = tagOf(row.tag);
    const area = areaOf(row.area);
    const city = cityOf(rowCity(row));
    return `
      <div class="title">${tag ? tag.emoji + " " : ""}${esc(row.name)}</div>
      <div class="meta">
        ${tag ? `<span class="pill">${esc(tag.name)}</span>` : ""}
        ${city ? `<span class="pill">${city.emoji} ${esc(city.name)}</span>` : ""}
        ${row.area ? `<span class="pill">${area ? area.emoji + " " : ""}${esc(row.area)}</span>` : ""}
        ${extraPills}
      </div>
      ${row.notes ? `<div class="notes">${esc(row.notes)}</div>` : ""}`;
  }

  function emptyState(icon, text) {
    return `<div class="empty"><span class="big">${icon}</span>${text}</div>`;
  }

  // ─── Itinerary ───────────────────────────────────────────────
  // The chosen day is remembered, and new stops are created on it
  const itinFilter = { q: "", day: store.get("japan.itinDay", ""), city: "", area: "", tags: new Set() };
  cityOptions($("itinCity"), "All cities");
  areaOptions($("itinArea"), "All areas", "");

  // Every date a stop covers, start through end (capped so a typo can't run away)
  function spanDays(r) {
    if (!r.date) return [""];
    const days = [r.date];
    if (r.end_date > r.date) {
      const d = parseISO(r.date);
      while (days.length < 60) {
        d.setDate(d.getDate() + 1);
        const s = isoOf(d);
        if (s > r.end_date) break;
        days.push(s);
      }
    }
    return days;
  }


  // Time column + range pills for one stop on one of its days
  function whenFor(r, idx, total) {
    if (total > 1) {
      // Times already show in the time column on the first and last day
      const startTxt = fmtDate(r.date, { month: "short", day: "numeric" });
      const endTxt = fmtDate(r.end_date, { month: "short", day: "numeric" });
      const col = idx === 0
        ? (r.time ? esc(fmtTime(r.time)) : `<small>From</small>`)
        : idx === total - 1
          ? (r.end_time ? `<small>until</small>${esc(fmtTime(r.end_time))}` : `<small>Last day</small>`)
          : `<small>All day</small>`;
      return { col, pills: `<span class="pill">📅 ${esc(startTxt)} → ${esc(endTxt)}</span><span class="pill">Day ${idx + 1} of ${total}</span>` };
    }
    const col = r.time ? esc(fmtTime(r.time)) : `<small>—</small>`;
    const pills = r.end_time
      ? `<span class="pill">🕘 ${r.time ? esc(fmtTime(r.time)) + " – " : "until "}${esc(fmtTime(r.end_time))}</span>`
      : "";
    return { col, pills };
  }

  // Stops with an Order (sort_order) come first, 1 first; the rest follow by time, no time last
  const manualOrder = r => { const n = parseFloat(r.sort_order); return Number.isFinite(n) ? n : Infinity; };
  const hasOrder = r => Number.isFinite(parseFloat(r.sort_order));
  const byManualOrder = (a, b) => (manualOrder(a) - manualOrder(b)) || (a.created_at || "").localeCompare(b.created_at || "");
  // Order within one day; stops already under way (from an earlier day) stay on top
  const byDayOrder = (a, b) =>
    (b.idx > 0) - (a.idx > 0) ||
    hasOrder(b.r) - hasOrder(a.r) ||
    (hasOrder(a.r) && manualOrder(a.r) - manualOrder(b.r)) ||
    (!a.r.time) - (!b.r.time) || (a.r.time || "").localeCompare(b.r.time || "") ||
    (a.r.created_at || "").localeCompare(b.r.created_at || "");

  // Every stop that starts on a day ("" = no date), in the order shown
  function dayStops(k) {
    return db.Itinerary.filter(r => (r.date || "") === k).map(r => ({ r, idx: 0 }))
      .sort(k ? byDayOrder : (a, b) => byManualOrder(a.r, b.r)).map(e => e.r);
  }

  const arrows = (r, i, count) => count > 1 ? `<div class="order-arrows">
        <button class="arrow-btn" data-stop data-move="-1" data-id="${esc(r.id)}" aria-label="Move up"${i === 0 ? " disabled" : ""}>▲</button>
        <button class="arrow-btn" data-stop data-move="1" data-id="${esc(r.id)}" aria-label="Move down"${i === count - 1 ? " disabled" : ""}>▼</button>
      </div>` : "";

  // Time column for an undated stop (only rows typed into the sheet): order number and time
  function orderCol(r, i, count) {
    const n = parseFloat(r.sort_order);
    return (Number.isFinite(n) ? `#${esc(String(n))}` : `<small>—</small>`) +
      (r.time ? `<small>${esc(fmtTime(r.time))}</small>` : "");
  }

  // ▲▼: swap with the neighbour shown on screen, then number every stop that day 1, 2, 3…
  let orderWrites = Promise.resolve();
  document.addEventListener("click", e => {
    const btn = e.target.closest("[data-move]");
    if (!btn || btn.disabled) return;
    const group = btn.closest(".group");
    const shown = [...group.querySelectorAll(".card[data-movable]")].map(c => c.dataset.id);
    const i = shown.indexOf(btn.dataset.id), j = i + Number(btn.dataset.move);
    if (j < 0 || j >= shown.length) return;
    const all = dayStops(group.dataset.day);
    const a = all.findIndex(r => r.id === shown[i]), b = all.findIndex(r => r.id === shown[j]);
    [all[a], all[b]] = [all[b], all[a]];
    const updates = all.map((r, n) => ({ id: r.id, sort_order: n + 1 })).filter((u, n) => parseFloat(all[n].sort_order) !== u.sort_order);
    updates.forEach(u => applyLocal(db, "update", "Itinerary", u));
    store.set("japan.cache", db);
    renderItinerary();
    // Saves run one after another so quick taps land in order
    updates.forEach(u => {
      orderWrites = orderWrites.then(() => apiWrite("update", "Itinerary", u)).catch(err => {
        toast("Couldn't save the order: " + err.message, true);
        refresh(true);
      });
    });
  });

  // Next free order number on a day; blank while nobody has reordered that day (sorts by time)
  function nextOrder(date) {
    const used = db.Itinerary.filter(r => (r.date || "") === (date || "")).map(r => parseFloat(r.sort_order)).filter(Number.isFinite);
    return used.length ? Math.floor(Math.max(...used)) + 1 : "";
  }

  function renderItinerary() {
    // Every trip day, plus any stop dated outside the trip
    const tripDays = spanDays({ date: TRIP_START, end_date: TRIP_END });
    const allDates = [...new Set([...tripDays, ...db.Itinerary.flatMap(spanDays).filter(Boolean)])].sort();
    // Day N counts from the trip start; 0 for dates outside the trip
    const dayNo = d => tripDays.indexOf(d) + 1;
    const dayLabel = d => dayNo(d) ? `Day ${dayNo(d)} · ` : "Outside trip · ";

    const daySel = $("itinDay");
    daySel.innerHTML = `<option value="">All days</option>` +
      allDates.map(d => `<option value="${d}">${dayLabel(d)}${esc(fmtDate(d))}</option>`).join("") +
      (db.Itinerary.some(r => !r.date) ? `<option value="__none">Not scheduled</option>` : "");
    if (itinFilter.day && (itinFilter.day === "__none" ? !db.Itinerary.some(r => !r.date) : !allDates.includes(itinFilter.day))) itinFilter.day = "";
    daySel.value = itinFilter.day;

    tagFilterChips($("itinTags"), TAGS, itinFilter.tags, renderItinerary);

    const rows = db.Itinerary.filter(r =>
      matchesQuery(r, itinFilter.q) &&
      (!itinFilter.city || rowCity(r) === itinFilter.city) &&
      (!itinFilter.area || r.area === itinFilter.area) &&
      (!itinFilter.tags.size || itinFilter.tags.has(r.tag)) &&
      (!itinFilter.day || (itinFilter.day === "__none" ? !r.date : spanDays(r).includes(itinFilter.day)))
    );

    const out = $("itinList");
    if (!db.Itinerary.length) { out.innerHTML = emptyState("🗾", "No plans yet.<br>Tap <b>+</b> to add your first stop."); return; }
    if (!rows.length) {
      const onlyDay = itinFilter.day && itinFilter.day !== "__none" && !itinFilter.q && !itinFilter.city && !itinFilter.tags.size;
      out.innerHTML = onlyDay
        ? emptyState("🗓️", `Nothing planned for ${dayLabel(itinFilter.day)}${esc(fmtDate(itinFilter.day))} yet.<br>Tap <b>+</b> to add a stop on this day.`)
        : emptyState("🔍", "Nothing matches these filters.");
      return;
    }

    // One entry per stop per day it covers
    const groups = new Map();
    rows.forEach(r => {
      const days = spanDays(r);
      days.forEach((k, idx) => {
        if (itinFilter.day && itinFilter.day !== "__none" && k !== itinFilter.day) return;
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push({ r, idx, total: days.length });
      });
    });
    const keys = [...groups.keys()].sort((a, b) => (!a) - (!b) || a.localeCompare(b));
    out.innerHTML = keys.map(k => {
      const items = groups.get(k).sort(k ? byDayOrder : (a, b) => byManualOrder(a.r, b.r));
      // Only a stop's first day can be reordered
      const movable = items.filter(e => e.idx === 0).map(e => e.r);
      const head = k
        ? `<div class="group-title">${dayNo(k) ? `<span class="day-pill">DAY ${dayNo(k)}</span>` : `<span class="day-pill">OUTSIDE TRIP</span>`}${esc(fmtDate(k, { weekday: "long", month: "short", day: "numeric" }))}</div>`
        : `<div class="group-title">Not scheduled yet</div>`;
      return `<div class="group" data-day="${esc(k)}">
        <div class="group-head">${head}<span class="group-sub">${items.length} stop${items.length === 1 ? "" : "s"}</span></div>
        ${items.map(({ r, idx, total }) => { const w = whenFor(r, idx, total); return `
          <div class="card${r.color === "orange" ? " hl" : ""}" data-sheet="Itinerary" data-id="${esc(r.id)}"${idx === 0 ? " data-movable" : ""}>
            <div class="when">${k ? w.col : orderCol(r, movable.indexOf(r), movable.length)}</div>
            <div class="body">
              ${placeCardBody(r, w.pills)}
              ${mapsLink(r, "Open in Maps") || extraLink(r) ? `<div class="card-actions">${mapsLink(r, "Open in Maps")}${extraLink(r)}</div>` : ""}
            </div>
            ${idx === 0 ? arrows(r, movable.indexOf(r), movable.length) : ""}
          </div>`; }).join("")}
      </div>`;
    }).join("");
  }

  $("itinSearch").addEventListener("input", e => { itinFilter.q = e.target.value.trim(); renderItinerary(); });
  $("itinDay").addEventListener("change", e => { itinFilter.day = e.target.value; store.set("japan.itinDay", itinFilter.day); renderItinerary(); renderSchedule(); });
  $("itinArea").addEventListener("change", e => { itinFilter.area = e.target.value; renderItinerary(); });
  $("itinCity").addEventListener("change", e => {
    itinFilter.city = e.target.value;
    itinFilter.area = "";
    areaOptions($("itinArea"), "All areas", itinFilter.city);
    renderItinerary();
  });

  // ─── Schedule ────────────────────────────────────────────────
  // A calendar view of one day. Only stops with a time show; it shares the day with the Itinerary filter.
  const SCHED_COLORS = { Restaurant: "#ff8a3d", Cafe: "#c8915a", Experience: "#bf5af2", View: "#30d158", Shopping: "#ff375f", Transportation: "#0a84ff" };
  const HOUR_PX = 60;
  const toMin = t => { const m = /^(\d{1,2}):(\d{2})/.exec(t || ""); return m ? +m[1] * 60 + +m[2] : null; };
  const minLabel = m => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;

  // The day shown: the Itinerary's day if one is picked, else today during the trip, else Day 1
  function schedDay() {
    if (/^\d{4}-/.test(itinFilter.day)) return itinFilter.day;
    const t = todayISO();
    return t >= TRIP_START && t <= TRIP_END ? t : TRIP_START;
  }

  // Timed entries on one day: blocks for the grid, and multi-day stops for the strip above it
  function schedEntries(k) {
    const blocks = [], allDay = [];
    db.Itinerary.forEach(r => {
      const days = spanDays(r), idx = days.indexOf(k);
      if (idx < 0) return;
      const start = toMin(r.time), end = toMin(r.end_time);
      if (days.length > 1) {
        if (start === null && end === null) return;
        const label = idx === 0 ? (start !== null ? `from ${minLabel(start)}` : "starts")
          : idx === days.length - 1 ? (end !== null ? `until ${minLabel(end)}` : "last day") : "all day";
        allDay.push({ r, label: `${label} · day ${idx + 1} of ${days.length}` });
      } else if (start !== null) {
        blocks.push({ r, start, end: end !== null && end > start ? end : start + 30, hasEnd: end !== null && end > start });
      }
    });
    return { blocks, allDay };
  }

  // Side-by-side columns for overlapping blocks
  function layoutBlocks(blocks) {
    blocks.sort((a, b) => a.start - b.start || b.end - a.end);
    let cluster = [], clusterEnd = -1;
    const flush = () => {
      const cols = [];
      cluster.forEach(b => {
        let c = cols.findIndex(end => end <= b.start);
        if (c < 0) { c = cols.length; cols.push(0); }
        cols[c] = b.end;
        b.col = c;
      });
      cluster.forEach(b => { b.cols = cols.length; });
      cluster = [];
    };
    blocks.forEach(b => {
      if (b.start >= clusterEnd) { flush(); clusterEnd = -1; }
      cluster.push(b);
      clusterEnd = Math.max(clusterEnd, b.end);
    });
    flush();
    return blocks;
  }

  function evStyle(r) {
    const c = SCHED_COLORS[r.tag];
    return c ? `--ev:${c};` : "";
  }

  function renderSchedule() {
    const k = schedDay();
    const tripDays = spanDays({ date: TRIP_START, end_date: TRIP_END });
    const allDates = [...new Set([...tripDays, ...db.Itinerary.flatMap(spanDays).filter(Boolean), k])].sort();
    const dayNo = d => tripDays.indexOf(d) + 1;
    $("schedDays").innerHTML = allDates.map(d => {
      const e = schedEntries(d), n = e.blocks.length + e.allDay.length;
      return `<div class="sched-day${d === k ? " selected" : ""}${n ? " has-items" : ""}" data-sched-day="${d}">
        <small>${dayNo(d) ? "DAY " + dayNo(d) : "OUTSIDE"}</small>${esc(fmtDate(d, { weekday: "short", day: "numeric" }))}</div>`;
    }).join("");
    const sel = $("schedDays").querySelector(".selected");
    if (sel && currentTab === "schedule") sel.scrollIntoView({ inline: "center", block: "nearest" });

    const { blocks, allDay } = schedEntries(k);
    const out = $("schedView");
    const head = `<div class="group-head"><div class="group-title">${dayNo(k) ? `<span class="day-pill">DAY ${dayNo(k)}</span>` : `<span class="day-pill">OUTSIDE TRIP</span>`}${esc(fmtDate(k, { weekday: "long", month: "short", day: "numeric" }))}</div></div>`;
    if (!blocks.length && !allDay.length) {
      out.innerHTML = head + emptyState("🕒", "Nothing with a time on this day.<br>Give a stop a start time to see it here.");
      return;
    }

    const strip = allDay.length ? `<div class="sched-allday">${allDay.map(({ r, label }) => `
      <div class="ev${r.color === "orange" ? " hl" : ""}" style="${evStyle(r)}" data-sheet="Itinerary" data-id="${esc(r.id)}">
        <b>${tagOf(r.tag) ? tagOf(r.tag).emoji + " " : ""}${esc(r.name)}</b><span class="ev-time">${esc(label)}</span>
      </div>`).join("")}</div>` : "";

    let grid = "";
    if (blocks.length) {
      layoutBlocks(blocks);
      const from = Math.max(0, Math.floor(Math.min(...blocks.map(b => b.start)) / 60) - 1);
      const to = Math.min(24, Math.ceil(Math.max(...blocks.map(b => b.end)) / 60) + 1);
      const y = m => (m - from * 60) / 60 * HOUR_PX;
      const hours = [];
      for (let h = from; h <= to; h++) hours.push(`<div class="sched-hour" style="top:${y(h * 60)}px"><span>${h < 24 ? minLabel(h * 60) : ""}</span></div>`);
      const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
      const nowLine = k === todayISO() && nowMin >= from * 60 && nowMin <= to * 60 ? `<div class="sched-now" style="top:${y(nowMin)}px"></div>` : "";
      const evs = blocks.map(b => {
        const h = Math.max(y(b.end) - y(b.start) - 2, 24);
        const time = b.hasEnd ? `${minLabel(b.start)}–${minLabel(b.end)}` : minLabel(b.start);
        return `<div class="ev${h >= 52 ? " tall" : ""}${b.r.color === "orange" ? " hl" : ""}" data-sheet="Itinerary" data-id="${esc(b.r.id)}"
          style="${evStyle(b.r)}top:${y(b.start) + 1}px;height:${h}px;left:calc(${b.col / b.cols * 100}% + 4px);width:calc(${100 / b.cols}% - 6px);">
          ${h >= 40
            ? `<b>${tagOf(b.r.tag) ? tagOf(b.r.tag).emoji + " " : ""}${esc(b.r.name)}</b><span class="ev-time">${time}</span>`
            : `<b><span class="ev-time">${minLabel(b.start)}</span>${tagOf(b.r.tag) ? tagOf(b.r.tag).emoji + " " : ""}${esc(b.r.name)}</b>`}
        </div>`;
      }).join("");
      grid = `<div class="sched-grid" style="height:${(to - from) * HOUR_PX}px">${hours.join("")}${nowLine}${evs}</div>`;
    }
    out.innerHTML = head + strip + grid;
  }

  $("schedDays").addEventListener("click", e => {
    const d = e.target.closest("[data-sched-day]");
    if (!d) return;
    itinFilter.day = d.dataset.schedDay;
    store.set("japan.itinDay", itinFilter.day);
    renderSchedule();
    renderItinerary();
  });

  // ─── Saved locations ─────────────────────────────────────────
  const savedFilter = { q: "", city: "", area: "", group: store.get("japan.savedGroup", "area"), tags: new Set() };
  cityOptions($("savedCity"), "All cities");
  areaOptions($("savedArea"), "All areas", "");
  $("savedGroup").value = savedFilter.group;

  function renderSaved() {
    const placeTags = TAGS.filter(t => !t.itineraryOnly);
    tagFilterChips($("savedTags"), placeTags, savedFilter.tags, renderSaved);

    const inItin = new Set(db.Itinerary.map(r => r.saved_id).filter(Boolean));
    const rows = db.Saved.filter(r =>
      matchesQuery(r, savedFilter.q) &&
      (!savedFilter.city || rowCity(r) === savedFilter.city) &&
      (!savedFilter.area || r.area === savedFilter.area) &&
      (!savedFilter.tags.size || savedFilter.tags.has(r.tag))
    ).sort((a, b) => String(a.name).localeCompare(String(b.name)));

    const out = $("savedList");
    if (!db.Saved.length) { out.innerHTML = emptyState("📍", "No saved places yet.<br>Tap <b>+</b> to save somewhere you want to go."); return; }
    if (!rows.length) { out.innerHTML = emptyState("🔍", "Nothing matches these filters."); return; }

    const card = r => `
      <div class="card${r.color === "orange" ? " hl" : ""}" data-sheet="Saved" data-id="${esc(r.id)}">
        <div class="body">
          ${placeCardBody(r, inItin.has(r.id) ? `<span class="pill done">✓ In itinerary</span>` : "")}
          <div class="card-actions">
            ${mapsLink(r, "Maps")}${extraLink(r)}
            <button class="link-btn orange" data-to-itin="${esc(r.id)}">＋ Itinerary</button>
          </div>
        </div>
      </div>`;

    if (savedFilter.group === "none") { out.innerHTML = rows.map(card).join(""); return; }

    // Groups rows by keyOf, ordered by `order`; unknown keys after, blank key last.
    const groupBy = (items, keyOf, order) => {
      const groups = new Map();
      items.forEach(r => { const k = keyOf(r) || ""; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); });
      const rank = k => { const i = order.indexOf(k); return k === "" ? 1e6 : i < 0 ? 1e5 : i; };
      return [...groups.entries()].sort((a, b) => rank(a[0]) - rank(b[0]) || a[0].localeCompare(b[0]));
    };
    const head = (title, n) => `<div class="group-head"><div class="group-title">${title}</div><span class="group-sub">${n}</span></div>`;

    if (savedFilter.group === "tag") {
      out.innerHTML = groupBy(rows, r => r.tag, placeTags.map(t => t.name)).map(([k, items]) => {
        const t = tagOf(k);
        return `<div class="group">${head(k ? (t ? t.emoji + " " : "") + esc(k) : "No tag", items.length)}${items.map(card).join("")}</div>`;
      }).join("");
      return;
    }

    // City, then area within the city
    out.innerHTML = groupBy(rows, rowCity, CITIES.map(c => c.name)).map(([city, items]) => {
      const c = cityOf(city);
      const title = city ? (c ? c.emoji + " " : "") + esc(city) : "No city";
      const areas = c?.areas || [];
      const body = !areas.length || items.every(r => !r.area)
        ? items.map(card).join("")
        : groupBy(items, r => r.area, areas.map(a => a.name)).map(([area, sub]) => {
            const a = areaOf(area);
            const subTitle = area ? (a ? a.emoji + " " : "") + esc(area) : `Anywhere in ${esc(city)}`;
            return `<div class="subgroup-title">${subTitle} · ${sub.length}</div>${sub.map(card).join("")}`;
          }).join("");
      return `<div class="group">${head(title, items.length)}${body}</div>`;
    }).join("");
  }

  $("savedSearch").addEventListener("input", e => { savedFilter.q = e.target.value.trim(); renderSaved(); });
  $("savedArea").addEventListener("change", e => { savedFilter.area = e.target.value; renderSaved(); });
  $("savedCity").addEventListener("change", e => {
    savedFilter.city = e.target.value;
    savedFilter.area = "";
    areaOptions($("savedArea"), "All areas", savedFilter.city);
    renderSaved();
  });
  $("savedGroup").addEventListener("change", e => { savedFilter.group = e.target.value; store.set("japan.savedGroup", e.target.value); renderSaved(); });

  // Card clicks: open editor, but let Maps links / buttons do their own thing
  document.addEventListener("click", e => {
    if (e.target.closest("[data-stop]")) return;
    const toItin = e.target.closest("[data-to-itin]");
    if (toItin) {
      const s = db.Saved.find(r => r.id === toItin.dataset.toItin);
      if (s) openPlaceSheet("Itinerary", null, { name: s.name, tag: s.tag, city: rowCity(s), area: s.area, notes: s.notes, map_url: s.map_url, links: linksOf(s), color: s.color || "", saved_id: s.id });
      return;
    }
    const card = e.target.closest("[data-sheet][data-id]");
    if (card) {
      const row = db[card.dataset.sheet].find(r => r.id === card.dataset.id);
      if (row) openPlaceSheet(card.dataset.sheet, row);
    }
  });

  // ─── Place sheet ─────────────────────────────────────────────
  let sheetCtx = null; // { sheet, row, prefill, tag }
  cityOptions($("pCity"), "— No city —");
  // The Order field is for itinerary stops only
  function toggleOrderField() {
    $("pOrderField").classList.toggle("hidden", sheetCtx?.sheet !== "Itinerary");
  }
  // Day dropdowns fill the (hidden) start and end dates. A date outside the trip that a stop
  // already has stays in the list so editing it doesn't lose it.
  function dayOption(d) {
    const tripDays = spanDays({ date: TRIP_START, end_date: TRIP_END });
    const n = tripDays.indexOf(d) + 1;
    return `<option value="${d}">${n ? `Day ${n} · ` : ""}${esc(fmtDate(d, { month: "short", day: "numeric" }))}</option>`;
  }
  function syncDaySelect() {
    const date = $("pDate").value, endDate = $("pEndDate").value;
    const tripDays = spanDays({ date: TRIP_START, end_date: TRIP_END });
    const startDays = [...new Set([...tripDays, date].filter(Boolean))].sort();
    $("pDay").innerHTML = (date ? "" : `<option value="">Pick a day…</option>`) + startDays.map(dayOption).join("");
    $("pDay").value = date;
    const endDays = [...new Set([...tripDays, endDate].filter(Boolean))].sort().filter(d => !date || d > date);
    $("pEndDay").innerHTML = `<option value="">Same day</option>` + endDays.map(dayOption).join("");
    $("pEndDay").value = endDays.includes(endDate) ? endDate : "";
  }
  $("pDay").addEventListener("change", e => {
    $("pDate").value = e.target.value;
    // An end day that is no longer after the start day goes back to "Same day"
    if ($("pEndDate").value && $("pEndDate").value <= e.target.value) $("pEndDate").value = "";
    $("pDate").dispatchEvent(new Event("change"));
  });
  $("pEndDay").addEventListener("change", e => { $("pEndDate").value = e.target.value; });
  $("pDate").addEventListener("change", e => {
    syncDaySelect();
    // A stop moving to another day goes to the end of that day
    if (sheetCtx && (!sheetCtx.row || e.target.value !== sheetCtx.row.date)) $("pOrder").value = nextOrder(e.target.value);
    else if (sheetCtx) $("pOrder").value = sheetCtx.row.sort_order ?? "";
  });
  $("pCity").addEventListener("change", e => areaOptions($("pArea"), "— No area —", e.target.value, $("pAreaField")));

  function linkRow(l = {}) {
    const row = document.createElement("div");
    row.className = "link-row";
    row.innerHTML = `
      <input class="input" type="url" inputmode="url" placeholder="https://…" data-link-url>
      <div class="link-row-2">
        <input class="input" type="text" placeholder="Button name, e.g. Tickets (default: the site's name)" data-link-label>
        <button type="button" class="link-remove" aria-label="Remove link">✕</button>
      </div>`;
    row.querySelector("[data-link-url]").value = l.url || "";
    row.querySelector("[data-link-label]").value = l.label || "";
    row.querySelector(".link-remove").addEventListener("click", () => {
      row.remove();
      if (!$("pLinks").children.length) $("pLinks").append(linkRow());
    });
    return row;
  }
  function renderLinkRows(list) {
    $("pLinks").replaceChildren(...(list.length ? list : [{}]).map(linkRow));
  }
  function readLinkRows() {
    return [...$("pLinks").querySelectorAll(".link-row")]
      .map(r => ({ url: r.querySelector("[data-link-url]").value.trim(), label: r.querySelector("[data-link-label]").value.trim() }))
      .filter(l => l.url);
  }
  $("pAddLink").addEventListener("click", () => {
    const row = linkRow();
    $("pLinks").append(row);
    row.querySelector("input").focus();
  });

  function renderColorChips() {
    $("pColor").querySelectorAll(".chip").forEach(c => c.classList.toggle("selected", c.dataset.color === sheetCtx.color));
  }
  $("pColor").addEventListener("click", e => {
    const c = e.target.closest("[data-color]");
    if (!c || !sheetCtx) return;
    sheetCtx.color = c.dataset.color;
    renderColorChips();
  });

  function renderPlaceTags() {
    const tags = TAGS.filter(t => sheetCtx.sheet === "Itinerary" || !t.itineraryOnly);
    $("pTags").innerHTML = tags.map(t =>
      `<div class="chip${sheetCtx.tag === t.name ? " selected" : ""}" data-tag="${esc(t.name)}">${t.emoji} ${esc(t.name)}</div>`).join("");
    $("pTags").querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
      sheetCtx.tag = sheetCtx.tag === c.dataset.tag ? "" : c.dataset.tag;
      renderPlaceTags();
    }));
  }

  function openPlaceSheet(sheet, row, prefill = {}) {
    const src = row || prefill;
    sheetCtx = { sheet, row, prefill, tag: src.tag || "", color: src.color || "" };
    renderColorChips();
    const isItin = sheet === "Itinerary";
    $("sheetTitle").textContent = (row ? "Edit " : "Add ") + (isItin ? "stop" : "saved place");
    $("pName").value = src.name || "";
    // New places default to the city being filtered on, else Tokyo
    const filterCity = (isItin ? itinFilter : savedFilter).city;
    $("pCity").value = (row || prefill.name) ? rowCity(src) : (filterCity || DEFAULT_CITY);
    areaOptions($("pArea"), "— No area —", $("pCity").value, $("pAreaField"));
    $("pArea").value = src.area || "";
    $("pDate").value = src.date || (isItin && !row ? (itinFilter.day && itinFilter.day !== "__none" ? itinFilter.day : "") : "");
    $("pEndDate").value = src.end_date || "";
    syncDaySelect();
    $("pTime").value = src.time || "";
    $("pEndTime").value = src.end_time || "";
    $("pOrder").value = src.sort_order ?? (row ? "" : nextOrder($("pDate").value));
    toggleOrderField();
    $("pScheduleError").style.display = "none";
    $("pMap").value = src.map_url || "";
    renderLinkRows(linksOf(src));
    $("pNotes").value = src.notes || "";
    $("pNameError").style.display = "none";
    $("pScheduleField").classList.toggle("hidden", !isItin);
    $("pSubmit").textContent = row ? "Save changes" : (isItin ? "Add to itinerary" : "Save place");
    $("pDelete").classList.toggle("hidden", !row);
    $("pToItin").classList.toggle("hidden", !(row && sheet === "Saved"));
    renderPlaceTags();
    $("backdrop").classList.add("visible");
    $("placeSheet").classList.add("visible");
    $("placeSheet").scrollTop = 0;
    if (!row && !prefill.name) setTimeout(() => $("pName").focus(), 260);
  }

  function closePlaceSheet() {
    $("backdrop").classList.remove("visible");
    $("placeSheet").classList.remove("visible");
    sheetCtx = null;
  }

  async function savePlace() {
    const name = $("pName").value.trim();
    if (!name) { $("pNameError").style.display = "block"; $("pName").focus(); return; }
    const { sheet, row, prefill } = sheetCtx;
    const data = {
      id: row ? row.id : uid(),
      name,
      tag: sheetCtx.tag,
      city: $("pCity").value,
      area: $("pAreaField").classList.contains("hidden") ? "" : $("pArea").value,
      notes: $("pNotes").value.trim(),
      color: sheetCtx.color,
      map_url: $("pMap").value.trim(),
      links: readLinkRows(),
      // Older single-link columns are folded into `links`
      link_url: "",
      link_label: "",
    };
    if (sheet === "Itinerary") {
      const date = $("pDate").value, time = $("pTime").value;
      const endDate = $("pEndDate").value, endTime = $("pEndTime").value;
      const problem =
        !date ? "Pick a start day." :
        endDate && endDate < date ? "The end date is before the start date." :
        (!endDate || endDate === date) && time && endTime && endTime < time ? "The end time is before the start time." : "";
      if (problem) {
        $("pScheduleError").textContent = problem;
        $("pScheduleError").style.display = "block";
        $("pScheduleField").scrollIntoView({ block: "center", behavior: "smooth" });
        return;
      }
      data.date = date;
      data.time = time;
      data.end_date = endDate === date ? "" : endDate;
      data.end_time = endTime;
      const order = $("pOrder").value.trim();
      data.sort_order = order === "" ? "" : Number(order);
      data.saved_id = row ? (row.saved_id || "") : (prefill.saved_id || "");
    }
    closePlaceSheet();
    if (await mutate(row ? "update" : "create", sheet, data)) {
      toast(row ? "Saved" : sheet === "Itinerary" ? "Added to itinerary" : "Place saved");
    }
  }

  async function deletePlace() {
    const { sheet, row } = sheetCtx;
    if (!confirm(`Delete “${row.name}”?`)) return;
    closePlaceSheet();
    if (await mutate("delete", sheet, { id: row.id })) toast("Deleted");
  }

  $("sheetCancel").addEventListener("click", closePlaceSheet);
  $("backdrop").addEventListener("click", closePlaceSheet);
  $("sheetSave").addEventListener("click", savePlace);
  $("pSubmit").addEventListener("click", savePlace);
  $("pDelete").addEventListener("click", deletePlace);
  $("pToItin").addEventListener("click", () => {
    const s = sheetCtx.row;
    closePlaceSheet();
    setTimeout(() => openPlaceSheet("Itinerary", null, { name: s.name, tag: s.tag, city: rowCity(s), area: s.area, notes: s.notes, map_url: s.map_url, links: linksOf(s), color: s.color || "", saved_id: s.id }), 260);
  });
  $("fab").addEventListener("click", () => openPlaceSheet(currentTab === "saved" ? "Saved" : "Itinerary", null));
  document.addEventListener("keydown", e => { if (e.key === "Escape" && sheetCtx) closePlaceSheet(); });

  // ─── Expenses: form (mirrors expense_bot) ───────────────────
  let editingExpense = null;
  let expCurrency = store.get("japan.currency", DEFAULT_CURRENCY);
  if (!CURRENCIES[expCurrency]) expCurrency = DEFAULT_CURRENCY;

  PEOPLE.forEach(p => { const o = document.createElement("option"); o.value = o.textContent = p; $("recordedBy").appendChild(o); });
  PAYMENT_METHODS.forEach(m => { const o = document.createElement("option"); o.value = o.textContent = m; $("paymentMethod").appendChild(o); });

  function renderCurrencyChips() {
    $("currencyChips").innerHTML = Object.entries(CURRENCIES).map(([code, c]) =>
      `<div class="chip${code === expCurrency ? " selected" : ""}" data-cur="${code}">${c.symbol} ${code}</div>`).join("");
    $("currencyChips").querySelectorAll(".chip").forEach(ch => ch.addEventListener("click", () => {
      expCurrency = ch.dataset.cur;
      if (!editingExpense) store.set("japan.currency", expCurrency);
      renderCurrencyChips();
    }));
    $("currencyLabel").textContent = CURRENCIES[expCurrency].symbol;
    $("amount").placeholder = CURRENCIES[expCurrency].decimals ? "0.00" : "0";
  }

  // Labels: defaults + any label already used in the sheet
  let selectedLabels = new Set();
  let extraLabels = [];
  function allLabels() {
    const used = db.Expenses.flatMap(e => list(e.labels));
    return [...new Set([...DEFAULT_LABELS, ...used, ...extraLabels])];
  }
  function renderLabelChips() {
    const el = $("labelChips");
    el.innerHTML = allLabels().map(l => `<div class="chip${selectedLabels.has(l) ? " selected" : ""}" data-l="${esc(l)}">${esc(l)}</div>`).join("") +
      `<div class="chip add-new" data-add>+ Add</div>`;
    el.querySelectorAll(".chip[data-l]").forEach(c => c.addEventListener("click", () => {
      const l = c.dataset.l; selectedLabels.has(l) ? selectedLabels.delete(l) : selectedLabels.add(l); renderLabelChips();
    }));
    el.querySelector("[data-add]").addEventListener("click", () => { $("newLabelInput").style.display = "block"; $("newLabelInput").focus(); });
  }
  $("newLabelInput").addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    const v = e.target.value.trim();
    if (v) { extraLabels.push(v); selectedLabels.add(v); }
    e.target.value = ""; e.target.style.display = "none";
    renderLabelChips();
  });

  let selectedPaymentTag = null;
  let paymentTags = [...PAYMENT_TAGS];
  function renderPaymentTagChips() {
    const el = $("paymentTagChips");
    el.innerHTML = paymentTags.map(t => `<div class="chip${selectedPaymentTag === t ? " selected" : ""}" data-t="${esc(t)}">${esc(t)}</div>`).join("") +
      `<div class="chip add-new" data-add>+ Add</div>`;
    el.querySelectorAll(".chip[data-t]").forEach(c => c.addEventListener("click", () => {
      selectedPaymentTag = selectedPaymentTag === c.dataset.t ? null : c.dataset.t; renderPaymentTagChips();
    }));
    el.querySelector("[data-add]").addEventListener("click", () => { $("newPaymentTagInput").style.display = "block"; $("newPaymentTagInput").focus(); });
  }
  $("newPaymentTagInput").addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    const v = e.target.value.trim();
    if (v && !paymentTags.includes(v)) paymentTags.push(v);
    if (v) selectedPaymentTag = v;
    e.target.value = ""; e.target.style.display = "none";
    renderPaymentTagChips();
  });

  let selectedPaidBy = new Set([PAID_BY_DEFAULT]);
  function renderPaidByChips() {
    $("paidByChips").innerHTML = PEOPLE.map(p => `<div class="chip${selectedPaidBy.has(p) ? " selected" : ""}" data-p="${esc(p)}">${esc(p)}</div>`).join("");
    $("paidByChips").querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
      const p = c.dataset.p; selectedPaidBy.has(p) ? selectedPaidBy.delete(p) : selectedPaidBy.add(p); renderPaidByChips();
    }));
  }

  const splitInputs = {};
  PEOPLE.forEach(name => {
    const row = document.createElement("div");
    row.className = "split-amount-row";
    row.innerHTML = `<span class="name-label">${esc(name)}</span><input type="number" inputmode="decimal" step="0.01" min="0" placeholder="0">`;
    $("splitAmountRows").appendChild(row);
    splitInputs[name] = row.querySelector("input");
  });
  const splitKey = name => "split_amount_" + name.toLowerCase();

  function updateSplitAmounts() {
    const isHalf = $("splitType").value === "50/50";
    const amt = parseFloat($("amount").value) || 0;
    const share = amt ? +(amt / PEOPLE.length).toFixed(2) : "";
    PEOPLE.forEach(n => { splitInputs[n].disabled = isHalf; if (isHalf) splitInputs[n].value = share; });
  }
  function updateSplitVisibility() {
    $("splitAmountField").style.display = $("split").checked ? "block" : "none";
    if ($("split").checked) updateSplitAmounts();
  }
  $("split").addEventListener("change", updateSplitVisibility);
  $("splitType").addEventListener("change", updateSplitAmounts);
  $("amount").addEventListener("input", updateSplitAmounts);

  function resetExpenseForm() {
    editingExpense = null;
    expCurrency = store.get("japan.currency", DEFAULT_CURRENCY);
    if (!CURRENCIES[expCurrency]) expCurrency = DEFAULT_CURRENCY;
    $("amount").value = "";
    $("description").value = "";
    $("expDate").value = todayISO();
    $("paymentMethod").value = PAYMENT_DEFAULT;
    $("recordedBy").value = RECORDED_BY_DEFAULT;
    $("expNotes").value = "";
    $("paymentNotes").value = "";
    $("split").checked = false;
    $("splitType").value = "50/50";
    PEOPLE.forEach(n => { splitInputs[n].value = ""; splitInputs[n].disabled = false; });
    selectedLabels = new Set();
    selectedPaidBy = new Set([PAID_BY_DEFAULT]);
    selectedPaymentTag = null;
    $("amountError").style.display = "none";
    $("expSubmit").textContent = "Add expense";
    $("expSubmit").classList.remove("submitting");
    $("expDelete").classList.add("hidden");
    $("expCancel").classList.add("hidden");
    renderExpenseForm();
    updateSplitVisibility();
  }

  function renderExpenseForm() {
    renderCurrencyChips();
    renderLabelChips();
    renderPaymentTagChips();
    renderPaidByChips();
  }

  function editExpense(e) {
    editingExpense = e;
    expCurrency = CURRENCIES[e.currency] ? e.currency : DEFAULT_CURRENCY;
    $("amount").value = e.amount || "";
    $("description").value = e.description || "";
    $("expDate").value = e.date || todayISO();
    $("paymentMethod").value = PAYMENT_METHODS.includes(e.payment_method) ? e.payment_method : PAYMENT_DEFAULT;
    $("recordedBy").value = PEOPLE.includes(e.updated_by) ? e.updated_by : RECORDED_BY_DEFAULT;
    $("expNotes").value = e.notes || "";
    $("paymentNotes").value = e.payment_notes || "";
    $("split").checked = !!e.split;
    $("splitType").value = e.split_type || "50/50";
    PEOPLE.forEach(n => { splitInputs[n].value = e[splitKey(n)] ?? ""; });
    selectedLabels = new Set(list(e.labels));
    selectedPaidBy = new Set(list(e.paid_by));
    selectedPaymentTag = e.payment_tag || null;
    if (selectedPaymentTag && !paymentTags.includes(selectedPaymentTag)) paymentTags.push(selectedPaymentTag);
    $("expSubmit").textContent = "Save changes";
    $("expDelete").classList.remove("hidden");
    $("expCancel").classList.remove("hidden");
    renderExpenseForm();
    updateSplitVisibility();
    setExpMode("add");
  }

  async function submitExpense() {
    const amt = parseFloat($("amount").value);
    const valid = amt > 0;
    $("amountError").style.display = valid ? "none" : "block";
    if (!valid) { $("amount").focus(); return; }

    const data = {
      id: editingExpense ? editingExpense.id : uid(),
      date: $("expDate").value,
      description: $("description").value.trim(),
      amount: amt,
      currency: expCurrency,
      payment_method: $("paymentMethod").value,
      payment_tag: selectedPaymentTag || "",
      payment_notes: $("paymentNotes").value.trim(),
      labels: [...selectedLabels].join(", "),
      split: $("split").checked,
      split_type: $("split").checked ? $("splitType").value : "",
      paid_by: [...selectedPaidBy].join(", "),
      notes: $("expNotes").value.trim(),
      updated_by: $("recordedBy").value,
    };
    PEOPLE.forEach(n => {
      const raw = splitInputs[n].value;
      data[splitKey(n)] = $("split").checked && raw !== "" ? parseFloat(raw) : "";
    });

    const wasEditing = !!editingExpense;
    $("expSubmit").classList.add("submitting");
    $("expSubmit").textContent = "Logging...";
    const ok = await mutate(wasEditing ? "update" : "create", "Expenses", data);
    $("expSubmit").classList.remove("submitting");
    if (ok) {
      toast(`✅ ${money(data.amount, data.currency)} · ${data.payment_method} · ${fmtDate(data.date)}`);
      resetExpenseForm();
      if (wasEditing) setExpMode("history");
    } else {
      $("expSubmit").textContent = wasEditing ? "Save changes" : "Add expense";
    }
  }

  $("expSubmit").addEventListener("click", submitExpense);
  $("expCancel").addEventListener("click", () => { resetExpenseForm(); setExpMode("history"); });
  $("expDelete").addEventListener("click", async () => {
    const e = editingExpense;
    if (!e || !confirm(`Delete “${e.description || money(e.amount, e.currency)}”?`)) return;
    resetExpenseForm();
    setExpMode("history");
    if (await mutate("delete", "Expenses", { id: e.id })) toast("Deleted");
  });

  // ─── Expenses: history ───────────────────────────────────────
  let expMode = "add";
  let displayCurrency = store.get("japan.displayCurrency", DEFAULT_CURRENCY);
  if (!CURRENCIES[displayCurrency]) displayCurrency = DEFAULT_CURRENCY;
  const expLabelFilter = new Set();
  let rates = null; // { base, rates: { CODE: units per 1 base } }

  function setExpMode(mode) {
    expMode = mode;
    $("expSeg").querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
    $("expAdd").classList.toggle("hidden", mode !== "add");
    $("expHistory").classList.toggle("hidden", mode !== "history");
    if (mode === "history") renderExpenses();
    window.scrollTo(0, 0);
  }
  $("expSeg").querySelectorAll("button").forEach(b => b.addEventListener("click", () => setExpMode(b.dataset.mode)));

  async function loadRates(base) {
    const cached = store.get("japan.rates." + base, null);
    if (cached && Date.now() - cached.ts < 6 * 3600e3) { rates = cached; return; }
    try {
      const res = await fetch("https://open.er-api.com/v6/latest/" + base);
      const json = await res.json();
      if (json.result !== "success") throw new Error("rates");
      rates = { base, rates: json.rates, ts: Date.now() };
      store.set("japan.rates." + base, rates);
    } catch {
      rates = cached; // stale is better than nothing
    }
    renderExpenses();
  }

  // Returns null when the rate is unknown.
  function convert(amount, from, to) {
    if (from === to) return amount;
    if (!rates || rates.base !== to || !rates.rates[from]) return null;
    return amount / rates.rates[from];
  }

  // Each person's share of one expense, in its own currency.
  function shares(e) {
    const out = {};
    PEOPLE.forEach(p => out[p] = 0);
    if (e.split) {
      const given = PEOPLE.map(p => e[splitKey(p)]).filter(v => v !== "" && v != null);
      if (e.split_type !== "50/50" && given.length) PEOPLE.forEach(p => out[p] = Number(e[splitKey(p)]) || 0);
      else PEOPLE.forEach(p => out[p] = e.amount / PEOPLE.length);
    } else {
      const payers = list(e.paid_by).filter(p => PEOPLE.includes(p));
      (payers.length ? payers : PEOPLE).forEach((p, _, arr) => out[p] = e.amount / arr.length);
    }
    return out;
  }

  function renderExpenses() {
    if (currentTab !== "expenses" || expMode !== "history") return;

    const labels = allLabels().filter(l => db.Expenses.some(e => list(e.labels).includes(l)));
    $("expLabelFilter").innerHTML = labels.map(l =>
      `<div class="chip small${expLabelFilter.has(l) ? " selected" : ""}" data-l="${esc(l)}">${esc(l)}</div>`).join("");
    $("expLabelFilter").querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
      const l = c.dataset.l; expLabelFilter.has(l) ? expLabelFilter.delete(l) : expLabelFilter.add(l); renderExpenses();
    }));

    const rows = db.Expenses.filter(e => !expLabelFilter.size || list(e.labels).some(l => expLabelFilter.has(l)));

    // Summary in the display currency
    let total = 0, unconverted = 0;
    const byLabel = new Map();
    const paid = {}, owe = {};
    PEOPLE.forEach(p => { paid[p] = 0; owe[p] = 0; });
    rows.forEach(e => {
      const v = convert(e.amount, e.currency, displayCurrency);
      if (v == null) { unconverted++; return; }
      total += v;
      const ls = list(e.labels);
      (ls.length ? ls : ["Unlabeled"]).forEach(l => byLabel.set(l, (byLabel.get(l) || 0) + v / (ls.length || 1)));
      const payers = list(e.paid_by).filter(p => PEOPLE.includes(p));
      payers.forEach(p => paid[p] += v / payers.length);
      const s = shares(e);
      PEOPLE.forEach(p => owe[p] += convert(s[p], e.currency, displayCurrency) || 0);
    });

    const curOpts = Object.entries(CURRENCIES).map(([c, o]) => `<option value="${c}"${c === displayCurrency ? " selected" : ""}>${o.symbol} ${c}</option>`).join("");
    const maxLabel = Math.max(1, ...byLabel.values());
    const multiCur = rows.some(e => e.currency !== displayCurrency);

    let settle = "";
    if (PEOPLE.length === 2) {
      const [a, b] = PEOPLE;
      const net = paid[a] - owe[a]; // >0: b owes a
      if (Math.abs(net) >= 0.5) settle = net > 0 ? `${esc(b)} owes ${esc(a)} ${money(net, displayCurrency)}` : `${esc(a)} owes ${esc(b)} ${money(-net, displayCurrency)}`;
      else if (rows.length) settle = "All square 🤝";
    }

    $("expSummary").innerHTML = `
      <div class="summary">
        <div class="summary-top">
          <div>
            <div class="label" style="margin-bottom:0">Total spent${expLabelFilter.size ? " (filtered)" : ""}</div>
            <div class="summary-total">${money(total, displayCurrency)}</div>
          </div>
          <select id="displayCurrency" aria-label="Show totals in">${curOpts}</select>
        </div>
        ${multiCur && rates && rates.base === displayCurrency ? `<div class="summary-note">Converted at today's rates</div>` : ""}
        ${unconverted ? `<div class="summary-note">${unconverted} expense${unconverted === 1 ? "" : "s"} in other currencies not included (rates unavailable)</div>` : ""}
        <div class="people">
          ${PEOPLE.map(p => `<div class="person"><div class="name">${esc(p)}</div><div class="num">${money(paid[p], displayCurrency)}</div><div class="sub">paid · share ${money(owe[p], displayCurrency)}</div></div>`).join("")}
        </div>
        ${settle ? `<div class="settle">${settle}</div>` : ""}
        ${byLabel.size ? `<div class="bars">${[...byLabel.entries()].sort((a, b) => b[1] - a[1]).map(([l, v]) => `
          <div class="bar-row"><span class="lbl">${esc(l)}</span><div class="bar-track"><div class="bar-fill" style="width:${(v / maxLabel * 100).toFixed(1)}%"></div></div><span class="val">${money(v, displayCurrency)}</span></div>`).join("")}</div>` : ""}
      </div>`;
    $("displayCurrency").addEventListener("change", e => {
      displayCurrency = e.target.value;
      store.set("japan.displayCurrency", displayCurrency);
      renderExpenses();
      loadRates(displayCurrency);
    });

    const out = $("expList");
    if (!db.Expenses.length) { out.innerHTML = emptyState("💴", "No expenses yet.<br>Log one under <b>New expense</b>."); return; }
    if (!rows.length) { out.innerHTML = emptyState("🔍", "No expenses with these labels."); return; }

    const groups = new Map();
    rows.forEach(e => { const k = e.date || ""; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e); });
    out.innerHTML = [...groups.keys()].sort((a, b) => (!a) - (!b) || b.localeCompare(a)).map(k => {
      const items = groups.get(k).sort((a, b) => (b.created_at || "").localeCompare(a.created_at || ""));
      const dayTotal = items.reduce((s, e) => s + (convert(e.amount, e.currency, displayCurrency) || 0), 0);
      return `<div class="group">
        <div class="group-head"><div class="group-title">${k ? esc(fmtDate(k)) : "No date"}</div><span class="group-sub">${money(dayTotal, displayCurrency)}</span></div>
        ${items.map(e => {
          const conv = e.currency !== displayCurrency ? convert(e.amount, e.currency, displayCurrency) : null;
          const sub = [list(e.labels).join(", "), e.paid_by && "paid by " + e.paid_by, e.split && "split " + (e.split_type || "")].filter(Boolean).join(" · ");
          return `<div class="exp-row" data-exp="${esc(e.id)}">
            <div><div class="desc">${esc(e.description || "(no description)")}</div><div class="sub">${esc(sub)}</div></div>
            <div class="amt">${money(e.amount, e.currency)}${conv != null ? `<small>≈ ${money(conv, displayCurrency)}</small>` : ""}</div>
          </div>`;
        }).join("")}
      </div>`;
    }).join("");
  }

  $("expList").addEventListener("click", ev => {
    const row = ev.target.closest("[data-exp]");
    if (!row) return;
    const e = db.Expenses.find(x => x.id === row.dataset.exp);
    if (e) editExpense(e);
  });

  // ─── Boot ────────────────────────────────────────────────────
  function renderAll() {
    renderItinerary();
    renderSchedule();
    renderSaved();
    renderExpenses();
    if (!editingExpense) renderLabelChips();
  }

  $("refreshBtn").addEventListener("click", () => refresh(false));
  $("demoBanner").classList.toggle("hidden", !!API_URL);

  showTab(currentTab);
  resetExpenseForm();
  renderAll();
  refresh(true);
  loadRates(displayCurrency);
  document.querySelectorAll(".tabbar button").forEach(b => b.addEventListener("click", () => { if (b.dataset.tab === "expenses") renderExpenses(); }));
</script>
</body>
</html>
